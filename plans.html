<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan tree · Docket</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 256x256">
<!--
  The Plan tree (#180 step 3): every plan in a desk's plan folder, the folder of markdown checklist plans another
  system keeps. Drawn from GET /api/plan-folder, read-only: nothing on this page changes a plan. Its own window,
  like the Usage page, since a folder of 80 plans needs more room than the details panel has.
-->
<style>
:root {
  --bg: #f7f6f3; --panel: #ffffff; --panel-2: #efeee9; --line: #e2e0d8; --text: #1f1e1b; --muted: #6b6a64;
  --accent: #c2410c; --ok: #15803d; --bad: #b91c1c; --warn: #a16207;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1b1b19; --panel: #232321; --panel-2: #2b2b28; --line: #373633; --text: #ecebe6; --muted: #a09f98; --accent: #f97316; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #1b1b19; --panel: #232321; --panel-2: #2b2b28; --line: #373633; --text: #ecebe6; --muted: #a09f98; --accent: #f97316; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24; color-scheme: dark; }
:root[data-accent] { --accent: var(--accent-light); }
@media (prefers-color-scheme: dark) { :root[data-accent]:not([data-theme="light"]) { --accent: var(--accent-dark); } }
:root[data-accent][data-theme="dark"] { --accent: var(--accent-dark); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; }
button { cursor: pointer; } button:hover { background: var(--panel-2); }
header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0 8px 0 0; color: var(--accent); }
header .where { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
header .grow { flex: 1; }
main { padding: 16px; max-width: 1200px; margin: 0 auto; }
.muted { color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.card .k { font-size: 12px; color: var(--muted); }
.card .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 16px; }
.box h2 { font-size: 14px; margin: 0 0 8px; }
.note { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
details.plan { margin: 2px 0 2px 0; }
details.plan > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 14px minmax(0, 1fr) 120px 90px; gap: 8px; align-items: center; padding: 3px 4px; border-radius: 6px; }
details.plan > summary::-webkit-details-marker { display: none; }
details.plan > summary::before { content: '▸'; color: var(--muted); }
details.plan[open] > summary::before { content: '▾'; }
details.plan > summary:hover { background: var(--panel-2); }
.kids { margin-left: 18px; border-left: 1px solid var(--line); padding-left: 6px; }
.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t small { color: var(--muted); margin-left: 6px; }
.bar { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }
.n { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.tag { font-size: 11px; border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; margin-left: 6px; font-weight: 400; color: var(--muted); }
.tag.held { color: var(--accent); border-color: var(--accent); }
.tag.lone { color: var(--warn); border-color: var(--warn); }
.items { margin: 2px 0 6px 22px; font-size: 13px; }
.item { display: flex; gap: 6px; padding: 1px 0; }
.item .ic { width: 14px; flex: none; color: var(--muted); }
.item.done .ic { color: var(--ok); }
.item .sub { color: var(--muted); font-size: 12px; }
.file { font-size: 12px; color: var(--muted); margin: 0 0 4px 22px; overflow-wrap: anywhere; }
.bad { color: var(--bad); }
ul.list { margin: 0; padding-left: 18px; font-size: 13px; }
ul.list li { margin: 2px 0; overflow-wrap: anywhere; }
.empty { padding: 30px; text-align: center; color: var(--muted); }
mark { background: color-mix(in srgb, var(--accent) 30%, transparent); color: inherit; }
</style>
<script>
// The same theme and main color as Docket's own page (index.html keeps them in this browser's storage).
(function () {
  const get = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const theme = get('theme'); if (theme) document.documentElement.dataset.theme = theme;
  const client = new URLSearchParams(location.search).get('client') || get('client');
  const hex = (get('companyColors') || {})[client] || get('accent');
  if (!/^#[0-9a-f]{6}$/i.test(hex || '')) return;
  const rgb = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
  const lum = (c) => { const [r, g, b] = c.map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
  const mix = (to, t) => rgb.map((v) => Math.round(v + (to - v) * t));
  const shade = (to, ok) => { for (let t = 0; t <= 1; t += 0.05) { const c = mix(to, t); if (ok(lum(c))) return c; } return mix(to, 1); };
  const css = (c) => '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
  const root = document.documentElement;
  root.style.setProperty('--accent-light', css(shade(0, (L) => L <= 0.18)));
  root.style.setProperty('--accent-dark', css(shade(255, (L) => L >= 0.25)));
  root.dataset.accent = hex;
})();
</script>
</head>
<body>
<header>
  <h1>Plan tree</h1>
  <span class="where" id="where"></span>
  <span class="grow"></span>
  <input type="search" id="find" placeholder="Find a plan or task" aria-label="Find a plan or task">
  <button id="openAll" title="Open every plan in the tree">Open all</button>
  <button id="closeAll" title="Fold every plan back to its title">Fold all</button>
  <button id="again" title="Read the plan folder again now. It is also read again by itself whenever this window gets the focus.">Read again</button>
</header>
<main id="main"><div class="empty">Reading the plan folder…</div></main>
<script>
const client = new URLSearchParams(location.search).get('client') || '';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICON = { open: '○', claimed: '●', done: '✓', waiting_on_user: '⏸', sent_back: '↩' };
const WORD = { open: '', claimed: 'claimed', done: '', waiting_on_user: 'waiting on the user', sent_back: 'sent back' };
let T = null, opened = new Set(), find = '';

async function load() {
  try {
    const r = await fetch('/api/plan-folder?' + new URLSearchParams({ client }));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Docket did not answer');
    T = d; render();
  } catch (e) { $('main').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
const byKey = () => new Map(T.plans.map((p) => [p.key, p]));
const pct = (p) => p.total ? Math.round(100 * p.done / p.total) : 0;
// A plan matches the search when its title, file or any task does, or a plan under it does.
function matches(p, m, seen = new Set()) {
  if (!find || seen.has(p.key)) return !find;
  seen.add(p.key);
  const q = find.toLowerCase();
  return p.title.toLowerCase().includes(q) || p.key.toLowerCase().includes(q) || p.items.some((i) => i.title.toLowerCase().includes(q))
    || p.children.some((k) => m.get(k) && matches(m.get(k), m, seen));
}
const hl = (s) => { if (!find) return esc(s); const i = s.toLowerCase().indexOf(find.toLowerCase()); return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + find.length)) + '</mark>' + esc(s.slice(i + find.length)); };
function holdersOf(p) {
  return (T.holders || []).filter((h) => h.key === p.key).map((h) => h.title ? `${h.title} (${h.prefix})` : `session ${h.prefix}`);
}
function planHtml(p, m, depth, seen) {
  if (seen.has(p.key) || !matches(p, m)) return '';
  seen.add(p.key);
  const held = holdersOf(p);
  const tags = [held.length ? `<span class="tag held" title="${esc('Held by ' + held.join(', '))}">held by ${esc(held.length === 1 ? held[0] : held.length + ' sessions')}</span>` : '',
    p.unlinked ? '<span class="tag lone" title="No other file names this plan">nothing links here</span>' : ''].join('');
  const items = p.items.map((it) => {
    const sub = [WORD[it.state], it.holder ? 'held by ' + (it.holderTitle || it.holder) : '', it.after?.length && it.state !== 'done' ? 'after ' + it.after.join(', ') : '',
      it.sub.length ? it.sub.map((k) => { const c = m.get(k); return c ? `its plan: ${c.done} of ${c.total} done` : ''; }).join(', ') : '', it.note].filter(Boolean);
    return `<div class="item ${it.state}" style="margin-left:${Math.min(it.depth, 12) * 6}px" title="${esc(it.brief || '')}"><span class="ic">${ICON[it.state] || '○'}</span><span>${hl((it.id ? it.id + ' ' : '') + it.title)}${sub.length ? ` <span class="sub">· ${esc(sub.join(' · '))}</span>` : ''}</span></div>`;
  }).join('');
  const kids = p.children.map((k) => m.get(k)).filter(Boolean).map((c) => planHtml(c, m, depth + 1, seen)).join('');
  const open = opened.has(p.key) || (find && kids) ? ' open' : '';
  return `<details class="plan" data-key="${esc(p.key)}"${open}><summary><span class="t">${hl(p.title)}<small>${esc(p.key)}</small>${tags}</span><span class="bar" title="${p.done} of ${p.total} done, counting the plans under it"><i style="width:${pct(p)}%"></i></span><span class="n">${p.done} of ${p.total} done</span></summary>
    <div class="file">${esc(p.file)}${p.coordinator ? ` · coordinator ${esc(p.coordinatorTitle || p.coordinator)}` : ''}${p.made ? ` · made ${esc(p.made)}` : ''}${p.own.total !== p.total ? ` · its own lines: ${p.own.done} of ${p.own.total} done` : ''}</div>
    <div class="items">${items || '<span class="muted">No checklist lines.</span>'}</div>${kids ? `<div class="kids">${kids}</div>` : ''}</details>`;
}
function render() {
  if (!T) return;
  $('where').textContent = `${T.desk} · ${T.root}${T.at ? ' · read ' + new Date(T.at).toLocaleTimeString() : ''}`;
  if (T.error) { $('main').innerHTML = `<div class="empty">${esc(T.error)}</div>`; return; }
  const m = byKey(), seen = new Set();
  const all = T.plans.reduce((a, p) => p.parent ? a : { done: a.done + p.done, total: a.total + p.total }, { done: 0, total: 0 });
  const tree = T.roots.map((k) => planHtml(m.get(k), m, 0, seen)).join('');
  const elsewhere = (T.holders || []).filter((h) => !h.key);
  $('main').innerHTML = `<div class="cards">
      <div class="card"><div class="k">Plans</div><div class="v">${T.plans.length}</div></div>
      <div class="card"><div class="k">Done, all plans</div><div class="v">${all.done} of ${all.total}</div></div>
      <div class="card"><div class="k">Top plans</div><div class="v">${T.roots.length}</div></div>
      <div class="card"><div class="k">Broken links</div><div class="v${T.broken.length ? ' bad' : ''}">${T.broken.length}</div></div>
      <div class="card"><div class="k">Nothing links here</div><div class="v">${T.unlinked.length}</div></div>
      <div class="card"><div class="k">Held by a session</div><div class="v">${new Set((T.holders || []).filter((h) => h.key).map((h) => h.key)).size}</div></div>
    </div>
    <div class="box"><h2>The tree</h2><p class="note">Read-only: another system keeps these plans, and Docket only shows them. A plan hangs under the plan its "Part of:" line names, or else under the plan whose checklist line links to it. Progress counts a line with a plan under it as that plan's lines.${T.capped ? ' The folder holds more markdown files than Docket reads at once, so some are left out.' : ''}</p>
      ${tree || `<div class="empty">${find ? 'No plan matches.' : 'No checklist plans in this folder.'}</div>`}</div>
    <div class="box"><h2>Broken links ${T.broken.length}</h2><p class="note">Links to markdown files that are not there.</p>
      ${T.broken.length ? `<ul class="list">${T.broken.map((b) => `<li><b>${esc(b.ref)}</b> <span class="muted">in ${esc(b.from)}${b.line ? ', line ' + b.line : ''}</span></li>`).join('')}</ul>` : '<span class="muted">None.</span>'}</div>
    <div class="box"><h2>Plans nothing links to ${T.unlinked.length}</h2><p class="note">No other file in the folder names these plans, so a person reading from the top would not find them.</p>
      ${T.unlinked.length ? `<ul class="list">${T.unlinked.map((k) => { const p = m.get(k); return `<li><a href="#" data-go="${esc(k)}">${esc(p?.title || k)}</a> <span class="muted">${esc(k)} · ${p ? `${p.done} of ${p.total} done` : ''}</span></li>`; }).join('')}</ul>` : '<span class="muted">None.</span>'}</div>
    ${elsewhere.length ? `<div class="box"><h2>Held plans outside the folder</h2><ul class="list">${elsewhere.map((h) => `<li>${esc(h.title || 'session ' + h.prefix)}: <span class="muted">${esc(h.plan)}</span></li>`).join('')}</ul></div>` : ''}`;
}
// Remember which plans are open, so a redraw keeps them.
document.addEventListener('toggle', (e) => { const k = e.target.dataset?.key; if (!k || find) return; if (e.target.open) opened.add(k); else opened.delete(k); }, true);
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-go]'); if (!a) return;
  e.preventDefault();
  const m = byKey(); for (let k = a.dataset.go; k; k = m.get(k)?.parent) opened.add(k);
  find = ''; $('find').value = ''; render();
  document.querySelector(`details[data-key="${CSS.escape(a.dataset.go)}"]`)?.scrollIntoView({ block: 'center' });
});
$('find').oninput = () => { find = $('find').value.trim(); render(); };
$('openAll').onclick = () => { opened = new Set(T?.plans.map((p) => p.key) || []); render(); };
$('closeAll').onclick = () => { opened = new Set(); render(); };
$('again').onclick = load;
window.addEventListener('focus', load);
load();
</script>
</body>
</html>
